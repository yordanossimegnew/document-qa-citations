# PostgreSQL + pgvector, the API and the UI.   docker compose up --build
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: docqa
      POSTGRES_PASSWORD: docqa
      POSTGRES_DB: docqa
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docqa -d docqa"]
      interval: 2s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://docqa:docqa@postgres:5432/docqa
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build: .
    command: streamlit run ui/app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    ports:
      - "8501:8501"
    environment:
      AGENT_API_URL: http://api:8000
      PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - api

volumes:
  pgdata:
